[package]
name = "riptide-engine"
description = "Riptide download manager — runtime: queue scheduler, persistence, transfers and events behind one API shared by the app and the CLI"
license = "MIT OR Apache-2.0"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
riptide-core = { workspace = true }
riptide-net = { workspace = true }
riptide-store = { workspace = true }
riptide-media = { workspace = true }
riptide-crawl = { workspace = true }
riptide-torrent = { workspace = true }
reqwest = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
chrono = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
ts-rs = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true }

[features]
ts = ["dep:ts-rs", "riptide-core/ts"]

[dev-dependencies]
riptide-testserver = { workspace = true }
tempfile = { workspace = true }
sha1 = { workspace = true }
tracing-subscriber = { workspace = true }

[lints]
workspace = true
