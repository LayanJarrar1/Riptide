[package]
name = "riptide-media"
description = "Riptide download manager — video pages (YouTube, Vimeo, ...) through a bundled yt-dlp: probe, quality choices, download with progress, pause/resume"
license = "MIT OR Apache-2.0"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
riptide-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
tempfile = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }
hex = { workspace = true }

# A stand-in for yt-dlp used by this crate's tests (and the engine's): it speaks the same
# command line and output protocol, never touches the network, and is never shipped.
[[bin]]
name = "riptide-fake-yt-dlp"
path = "src/bin/fake_yt_dlp.rs"
test = false
doc = false

[lints]
workspace = true
