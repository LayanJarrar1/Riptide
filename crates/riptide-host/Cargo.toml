[package]
name = "riptide-host"
description = "Riptide download manager — Native Messaging host (browser extension <-> app bridge)"
license = "GPL-3.0-or-later"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lib]
name = "riptide_host"
path = "src/lib.rs"

[[bin]]
name = "riptide-host"
path = "src/main.rs"

[dependencies]
riptide-ipc = { workspace = true }
riptide-log = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
dirs = { workspace = true }

[target.'cfg(windows)'.dependencies]
# SetHandleInformation: keep the browser's stdio pipes out of the app the host starts
windows-sys = { workspace = true }

[dev-dependencies]
riptide-core = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
