[package]
name = "riptide-core"
description = "Riptide download manager — pure domain model: downloads, segments, state machine, segment planner"
license = "MIT OR Apache-2.0"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
serde = { workspace = true }
thiserror = { workspace = true }
unicode-normalization = { workspace = true }
ts-rs = { workspace = true, optional = true }

[features]
# `cargo test -p riptide-core --features ts` writes the TypeScript bindings the desktop app uses
# (see scripts/check.ps1, which also fails if the committed bindings are stale).
ts = ["dep:ts-rs"]

[dev-dependencies]
proptest = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
