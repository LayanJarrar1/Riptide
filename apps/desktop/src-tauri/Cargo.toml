[package]
name = "riptide-desktop"
description = "Riptide download manager — desktop application (Tauri v2 + Angular)"
license = "GPL-3.0-or-later"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lib]
name = "riptide_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Test-only: lets a test harness attach to the WebView2 (remote debugging port taken from
# RIPTIDE_CDP_PORT). Never part of a release build.
cdp = []
# Test-only: lets the update end-to-end test (scripts/test-update-e2e.ps1) point the updater at a
# local feed through RIPTIDE_UPDATE_ENDPOINT. Compiled out of release builds, so a release binary
# cannot be redirected by its environment (see docs/decisions.md D-updater-e2e and updater.rs).
update-e2e = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
# self-update from signed manifests on GitHub Releases (see src/updater.rs)
tauri-plugin-updater = "2"
url = { workspace = true }
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tauri-plugin-clipboard-manager = "2"
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
dirs = { workspace = true }
riptide-core = { workspace = true }
riptide-engine = { workspace = true }
riptide-host = { workspace = true }
riptide-ipc = { workspace = true }
riptide-log = { workspace = true }
riptide-net = { workspace = true }
riptide-media = { workspace = true }
riptide-crawl = { workspace = true }
riptide-ai = { workspace = true }
riptide-research = { workspace = true }
riptide-fs = { workspace = true }
riptide-store = { workspace = true }
chrono = { workspace = true }
tokio-util = { workspace = true }
reqwest = { workspace = true }
base64 = { workspace = true }

[target.'cfg(windows)'.dependencies]
# HKCU Native Messaging keys; a safe wrapper over the registry API (no `unsafe` in this crate)
winreg = "0.56"
# SetSuspendState (sleep / hibernate); the only unsafe call, isolated in src/power.rs
windows-sys = { workspace = true }
# toasts for finished downloads without the plugin's one-waiting-thread-per-toast (see src/notify.rs)
notify-rust = "4.18"

[dev-dependencies]
tempfile = { workspace = true }
riptide-torrent = { workspace = true }
sha1 = { workspace = true }
sha2 = { workspace = true }
wiremock = "0.6"
# real signatures for the updater specs (generates a throw-away key pair per test)
minisign = "0.10"
semver = "1"
tauri = { version = "2", features = ["test"] }
tracing-subscriber = { workspace = true }

[lints]
workspace = true
