[package]
name = "riptide-desktop"
description = "Riptide download manager — desktop application (Tauri v2 + Angular)"
license = "GPL-3.0-or-later"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lib]
name = "riptide_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
# self-update from signed manifests on GitHub Releases (see src/updater.rs)
tauri-plugin-updater = "2"
url = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
dirs = { workspace = true }
riptide-core = { workspace = true }
riptide-engine = { workspace = true }
riptide-host = { workspace = true }
riptide-ipc = { workspace = true }
riptide-log = { workspace = true }
riptide-net = { workspace = true }

[target.'cfg(windows)'.dependencies]
# HKCU Native Messaging keys; a safe wrapper over the registry API (no `unsafe` in this crate)
winreg = "0.56"

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
