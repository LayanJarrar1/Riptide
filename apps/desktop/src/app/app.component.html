<div class="shell">
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="18" height="18" focusable="false">
          <path d="M12 3v10.5" />
          <path d="M6.5 9.5 12 15l5.5-5.5" />
          <path d="M5 19h14" />
        </svg>
      </span>
      <span class="brand-name">{{ 'app.title' | t }}</span>
      <span class="brand-tagline">{{ 'app.tagline' | t }}</span>
    </div>

    <div class="controls">
      <app-segmented-control
        [label]="'lang.label' | t"
        [options]="langOptions()"
        [optionLang]="langOptionLang"
        [value]="i18n.lang()"
        (valueChange)="onLang($event)"
      />
      <app-segmented-control
        [label]="'theme.label' | t"
        [options]="themeOptions()"
        [value]="theme.theme()"
        (valueChange)="onTheme($event)"
      />
    </div>
  </header>

  <main class="stage">
    <section class="card" aria-labelledby="placeholder-heading">
      <p class="eyebrow">
        <span class="eyebrow-dot" aria-hidden="true"></span>
        {{ 'placeholder.status' | t }}
      </p>
      <h1 id="placeholder-heading" class="heading">{{ 'placeholder.heading' | t }}</h1>
      <p class="body">{{ 'placeholder.body' | t }}</p>
      <div class="current" aria-hidden="true">
        <span class="current-bar"></span>
      </div>
    </section>
  </main>

  <footer class="footer">
    <span class="footer-text">{{ 'footer.text' | t }}</span>
    @if (tauri.appInfo(); as info) {
      <span class="footer-version">
        {{ 'footer.version' | t }} <span class="mono">{{ info.version }}</span>
        <span class="footer-build">{{ info.build }}</span>
      </span>
    }
  </footer>
</div>
