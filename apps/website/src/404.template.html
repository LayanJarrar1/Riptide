<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{en.notFound.title}} · Riptide</title>
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" href="{{base}}assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="{{base}}css/site.css?v={{v}}">
  <script>
    // Before first paint: light is the default whatever the OS prefers; only a saved choice
    // switches to dark. `js` enables the scroll reveals; `rv-all` is a failsafe that shows them.
    (function () {
      var d = document.documentElement;
      d.classList.add('js');
      try {
        var t = localStorage.getItem('riptide-theme');
        if (t === 'light' || t === 'dark') d.dataset.theme = t;
      } catch (e) { /* storage blocked: stay light */ }
      var m = document.querySelector('meta[name="theme-color"]');
      if (m && d.dataset.theme === 'dark') m.setAttribute('content', '#071a26');
      setTimeout(function () { d.classList.add('rv-all'); }, 4000);
    })();
  </script>
</head>
<body class="not-found">
  <main class="container not-found-main">
    <a class="brand" href="{{base}}">
      <img class="brand-logo logo-light" src="{{base}}assets/riptide-logo-light.svg" alt="Riptide" width="690" height="254">
      <img class="brand-logo logo-dark" src="{{base}}assets/riptide-logo-dark.svg" alt="Riptide" width="690" height="254">
      
    </a>
    <section class="not-found-block font-latin" lang="en" dir="ltr">
      <h1>{{en.notFound.title}}</h1>
      <p>{{en.notFound.text}}</p>
      <a class="btn btn-primary" href="{{base}}">{{en.notFound.home}}</a>
    </section>
    <section class="not-found-block font-arabic" lang="ar" dir="rtl">
      <h1>{{ar.notFound.title}}</h1>
      <p>{{ar.notFound.text}}</p>
      <a class="btn btn-primary" href="{{base}}ar/">{{ar.notFound.home}}</a>
    </section>
  </main>
</body>
</html>
