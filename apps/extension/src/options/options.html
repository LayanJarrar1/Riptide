<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Riptide options</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main class="page">
      <header class="head">
        <svg class="logo" viewBox="0 0 100 100" aria-hidden="true">
          <rect width="100" height="100" rx="22" fill="#19C6B5" />
          <g fill="#06201D">
            <rect x="30" y="22" width="12" height="56" />
            <path d="M30 22 H47 A15.5 15.5 0 0 1 47 53 H30 V43 H47 A5.5 5.5 0 0 0 47 32 H30 Z" />
            <path d="M38 56 L50 48 L72 72 L72 78 L60 78 Z" />
          </g>
        </svg>
        <h1 data-i18n="options.title">Riptide options</h1>
        <span id="saved" class="saved" data-i18n="options.saved" aria-live="polite"></span>
      </header>

      <form id="form" autocomplete="off">
        <section class="card">
          <h2 data-i18n="options.section.capture"></h2>

          <label class="row check">
            <input id="enabled" type="checkbox" />
            <span data-i18n="options.enabled"></span>
          </label>

          <div class="row field">
            <label for="minSize" data-i18n="options.minSize"></label>
            <div class="inline">
              <input id="minSize" type="number" min="0" step="1" inputmode="numeric" />
              <select id="minSizeUnit">
                <option value="1024" data-i18n="units.kb"></option>
                <option value="1048576" data-i18n="units.mb"></option>
                <option value="1073741824" data-i18n="units.gb"></option>
              </select>
            </div>
            <p class="hint" data-i18n="options.minSize.hint"></p>
          </div>

          <fieldset class="row types">
            <legend data-i18n="options.types"></legend>
            <label class="check"><input type="checkbox" data-type="archives" /><span data-i18n="options.type.archives"></span></label>
            <label class="check"><input type="checkbox" data-type="video" /><span data-i18n="options.type.video"></span></label>
            <label class="check"><input type="checkbox" data-type="audio" /><span data-i18n="options.type.audio"></span></label>
            <label class="check"><input type="checkbox" data-type="programs" /><span data-i18n="options.type.programs"></span></label>
            <label class="check"><input type="checkbox" data-type="documents" /><span data-i18n="options.type.documents"></span></label>
            <label class="check"><input type="checkbox" data-type="images" /><span data-i18n="options.type.images"></span></label>
          </fieldset>

          <div class="row field">
            <label for="customExtensions" data-i18n="options.customExtensions"></label>
            <input id="customExtensions" type="text" spellcheck="false" dir="ltr" />
            <p class="hint" data-i18n="options.customExtensions.hint"></p>
          </div>
        </section>

        <section class="card">
          <h2 data-i18n="options.section.sites"></h2>

          <div class="row field">
            <label for="allowSites" data-i18n="options.allowSites"></label>
            <textarea id="allowSites" rows="3" spellcheck="false" dir="ltr"></textarea>
            <p class="hint" data-i18n="options.allowSites.hint"></p>
          </div>

          <div class="row field">
            <label for="denySites" data-i18n="options.denySites"></label>
            <textarea id="denySites" rows="3" spellcheck="false" dir="ltr"></textarea>
          </div>

          <div class="row field">
            <label for="neverAskSites" data-i18n="options.neverAskSites"></label>
            <textarea id="neverAskSites" rows="2" spellcheck="false" dir="ltr"></textarea>
          </div>

          <label class="row check">
            <input id="altBypass" type="checkbox" />
            <span data-i18n="options.altBypass"></span>
          </label>
        </section>

        <section class="card">
          <h2 data-i18n="options.section.behaviour"></h2>

          <label class="row check">
            <input id="notify" type="checkbox" />
            <span data-i18n="options.notify"></span>
          </label>

          <label class="row check">
            <input id="hoverBadge" type="checkbox" />
            <span data-i18n="options.hoverBadge"></span>
          </label>

          <div class="row field">
            <label for="language" data-i18n="options.language"></label>
            <select id="language">
              <option value="auto" data-i18n="options.language.auto"></option>
              <option value="en" data-i18n="options.language.en"></option>
              <option value="ar" data-i18n="options.language.ar"></option>
            </select>
          </div>
        </section>

        <section class="card about">
          <h2 data-i18n="options.section.about"></h2>
          <p id="about-host" class="mono"></p>
          <p id="about-id" class="mono"></p>
          <p class="hint" data-i18n="options.about.privacy"></p>
        </section>
      </form>
    </main>

    <script src="options.js"></script>
  </body>
</html>
