name: site

# Builds the website from the release manifest, tests it, checks the release links and, ONLY when the owner has
# turned deployment on, publishes it to GitHub Pages. Nothing is deployed until the repository variable
# SITE_DEPLOY is set to "true" (Settings, Secrets and variables, Actions, Variables) and Pages has its source set to
# "GitHub Actions". Until then the deploy steps are skipped and the workflow is a build-and-test run.

on:
  push:
    branches: [main]
    paths:
      - "apps/website/**"
      - "scripts/gen-release-manifest.mjs"
      - "scripts/check-release-links.mjs"
      - "scripts/check-doc-sync.mjs"
      - ".github/workflows/site.yml"
  pull_request:
    paths:
      - "apps/website/**"
      - "scripts/gen-release-manifest.mjs"
      - "scripts/check-release-links.mjs"
      - "scripts/check-doc-sync.mjs"
      - ".github/workflows/site.yml"
  release:
    types: [published]
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build, test, link check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Release manifest from the GitHub Releases API
        # Pull requests use the committed apps/website/release.json; every other trigger regenerates it.
        if: github.event_name != 'pull_request'
        run: node scripts/gen-release-manifest.mjs
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Script tests
        run: node --test scripts/gen-release-manifest.test.mjs scripts/set-release-version.test.mjs scripts/check-doc-sync.test.mjs

      - name: Versions agree (README, CHANGELOG, Cargo, Tauri, manifest)
        # A pull request that prepares a release (documents on the new version, release.json still on the old one)
        # passes with RIPTIDE_RELEASE_AHEAD=1; every other trigger is strict and fails until the release is published.
        run: node scripts/check-doc-sync.mjs
        env:
          RIPTIDE_RELEASE_AHEAD: ${{ github.event_name == 'pull_request' && '1' || '' }}

      - name: Build and verify
        run: node apps/website/build.mjs
        env:
          RIPTIDE_RELEASE_AHEAD: ${{ github.event_name == 'pull_request' && '1' || '' }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: End-to-end checks
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
          (cd apps/website/dist && python -m http.server 8391 --bind 127.0.0.1 &)
          sleep 2
          python apps/website/e2e/check.py http://127.0.0.1:8391/
        env:
          RIPTIDE_E2E_CHANNEL: ""
          RIPTIDE_RELEASE_AHEAD: ${{ github.event_name == 'pull_request' && '1' || '' }}

      - name: Release links answer 200
        # Skips with a notice while the repository is private (unauthenticated requests get 404).
        run: node scripts/check-release-links.mjs

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && vars.SITE_DEPLOY == 'true'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: apps/website/dist

  deploy:
    name: deploy to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request' && vars.SITE_DEPLOY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
