name: release

# Tag v<semver> -> signed installer + updater signature + portable zip + update manifests on a
# GitHub release. Same steps as scripts/release.ps1 (which builds locally and only prints the
# publish commands). Tags with a pre-release part (v0.1.0-alpha.3) become pre-releases and only
# feed the beta channel; plain tags (v0.1.0) also get latest.json for the stable channel.
#
# Secrets: TAURI_SIGNING_PRIVATE_KEY (contents of riptide-updater.key) and, if the key has one,
# TAURI_SIGNING_PRIVATE_KEY_PASSWORD.

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  windows:
    name: build and publish (windows)
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Version from tag
        id: v
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') { throw "tag ${{ github.ref_name }} is not v<semver>" }
          $pre = if ($version.Contains('-')) { 'true' } else { 'false' }
          "version=$version" >> $env:GITHUB_OUTPUT
          "prerelease=$pre" >> $env:GITHUB_OUTPUT

      - name: Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: npm ci
        working-directory: apps/desktop
        run: npm ci --no-audit --no-fund

      - name: Write the key and build
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) { throw 'secret TAURI_SIGNING_PRIVATE_KEY is not set' }
          $key = Join-Path $env:RUNNER_TEMP 'riptide-updater.key'
          [IO.File]::WriteAllText($key, $env:TAURI_SIGNING_PRIVATE_KEY)
          $params = @{ Version = '${{ steps.v.outputs.version }}'; KeyPath = $key; Notes = 'See the release page for what changed.' }
          if ('${{ steps.v.outputs.prerelease }}' -eq 'true') { $params.Prerelease = $true }
          & .\scripts\release.ps1 @params
          Remove-Item $key -Force

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = '${{ steps.v.outputs.version }}'
          $out = "target/release-artifacts/$version"
          $files = Get-ChildItem $out -File | ForEach-Object { $_.FullName }
          $flags = if ('${{ steps.v.outputs.prerelease }}' -eq 'true') { @('--prerelease') } else { @('--latest') }
          gh release create '${{ github.ref_name }}' @files --title "Riptide $version" --generate-notes @flags
          if ($LASTEXITCODE -ne 0) { throw 'gh release create failed' }

          # beta channel: one fixed pre-release holds the newest latest-beta.json
          gh release view channel-beta *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create channel-beta --prerelease --title 'Beta update channel' --notes 'Holds latest-beta.json for the beta update channel. Not a release.'
            if ($LASTEXITCODE -ne 0) { throw 'cannot create channel-beta' }
          }
          gh release upload channel-beta "$out/latest-beta.json" --clobber
          if ($LASTEXITCODE -ne 0) { throw 'cannot upload latest-beta.json' }

      # What the app does, unauthenticated: proves older versions will be notified. Once the
      # repository is public this must pass; a failure here means latest-beta.json is wrong.
      - name: Verify the update feed
        shell: pwsh
        run: |
          $verifyArgs = @{ ExpectVersion = '${{ steps.v.outputs.version }}' }
          if ('${{ steps.v.outputs.prerelease }}' -ne 'true') { $verifyArgs.Stable = $true }
          & .\scripts\verify-update-feed.ps1 @verifyArgs
          if ($LASTEXITCODE -ne 0) { throw 'the update feed check failed' }
