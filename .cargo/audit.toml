# cargo-audit configuration (https://github.com/rustsec/rustsec/tree/main/cargo-audit).
# Every ignore names its reason and an expiry date; the full text is D-advisories-1 in
# docs/decisions.md. Remove an entry as soon as the dependency is bumped, and at the latest
# on the expiry date (2026-12-31), when it must be re-decided.

[advisories]
ignore = [
  # ringbuf 0.4.8 via librqbit-utp 0.7.0: UB only if an element's Drop panics; uTP buffers hold
  # plain bytes. No fixed release is allowed by librqbit-utp. Expires 2026-12-31.
  "RUSTSEC-2026-0293",
  # zip 4.6.1 via tauri-plugin-updater 2.14.0: extract() symlink and SUID issues. Riptide never
  # calls extract (Windows updates run a signed NSIS installer). Fixed in zip >= 9.0.0, which the
  # plugin does not allow yet. Expires 2026-12-31.
  "RUSTSEC-2026-0367",
  "RUSTSEC-2026-0368",
  "RUSTSEC-2026-0369",
]
